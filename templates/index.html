{% extends "base.html" %}
{% block content %}

<div class="text-center mb-4">
    <h2 class="mb-3">Traffic Sign Recognition</h2>
    <p class="text-muted">Upload image/video or use live camera for real-time detection</p>
</div>

<!-- Mode Tabs -->
<ul class="nav nav-tabs justify-content-center mb-4" id="modeTabs" role="tablist">
    <li class="nav-item">
        <a class="nav-link active" id="image-tab" data-toggle="tab" href="#image" role="tab">Image Upload</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" id="camera-tab" data-toggle="tab" href="#camera" role="tab">Live Camera</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" id="video-tab" data-toggle="tab" href="#video" role="tab">Video Upload</a>
    </li>
</ul>

<div class="tab-content">
    <!-- Image Tab -->
    <div class="tab-pane fade show active" id="image" role="tabpanel">
        <form id="upload-file" method="post" enctype="multipart/form-data" class="text-center">
            <label for="imageUpload" class="upload-label btn btn-primary">
                Choose Image
            </label>
            <input type="file" name="file" id="imageUpload" accept="image/*">
        </form>

        <div class="image-section text-center" style="display:none;">
            <div class="img-preview mx-auto">
                <div id="imagePreview"></div>
            </div>
            <button type="button" class="btn btn-success btn-lg mt-3" id="btn-predict">Predict</button>
        </div>

        <div class="loader mx-auto mt-3" style="display:none;"></div>
        <div id="image-result" class="mt-4 text-center"></div>
    </div>

    <!-- Camera Tab -->
    <div class="tab-pane fade" id="camera" role="tabpanel">
        <div class="text-center">
            <video id="video" width="480" height="360" autoplay muted style="border: 3px solid #ddd; border-radius: 8px;"></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <div class="mt-3">
                <button id="start-camera" class="btn btn-primary">Start Camera</button>
                <button id="stop-camera" class="btn btn-danger" style="display:none;">Stop</button>
            </div>
            <div id="camera-result" class="mt-3"></div>
        </div>
    </div>

    <!-- Video Tab -->
    <div class="tab-pane fade" id="video" role="tabpanel">
        <form id="video-form" class="text-center">
            <label for="videoUpload" class="upload-label btn btn-primary">
                Choose Video
            </label>
            <input type="file" name="file" id="videoUpload" accept="video/*">
        </form>
        <div class="text-center mt-3">
            <button type="button" class="btn btn-success" id="btn-video-predict" style="display:none;">Analyze Video</button>
        </div>
        <div class="loader mx-auto mt-3" id="video-loader" style="display:none;"></div>
        <div id="video-result" class="mt-4 text-center"></div>
    </div>
</div>

{% endblock %}
